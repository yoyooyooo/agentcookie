name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Build Linux binaries on Ubuntu (CGO_ENABLED=1 requires native gcc)
  build-linux:
    runs-on: ubuntu-latest
    if: ${{ vars.RELEASE_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Install cross-compiler for arm64
      - name: install arm64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Build Linux amd64
      - name: build linux amd64
        run: |
          CGO_ENABLED=1 go build -ldflags "-s -w -X github.com/mvanhorn/agentcookie/internal/cli.Version=${{ github.ref_name }}" -o dist/linux-amd64/agentcookie ./cmd/agentcookie
        env:
          GOOS: linux
          GOARCH: amd64

      # Build Linux arm64
      - name: build linux arm64
        run: |
          CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc go build -ldflags "-s -w -X github.com/mvanhorn/agentcookie/internal/cli.Version=${{ github.ref_name }}" -o dist/linux-arm64/agentcookie ./cmd/agentcookie
        env:
          GOOS: linux
          GOARCH: arm64

      # Create tarballs with the frozen naming scheme
      - name: create linux tarballs
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Strip leading v
          
          mkdir -p release
          
          # Linux amd64
          tar -czvf "release/agentcookie_${VERSION}_linux_amd64.tar.gz" -C dist/linux-amd64 agentcookie
          
          # Linux arm64
          tar -czvf "release/agentcookie_${VERSION}_linux_arm64.tar.gz" -C dist/linux-arm64 agentcookie

      - name: upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: release/*.tar.gz

  # Build darwin binaries on macOS (codesigning requires macOS)
  build-darwin:
    runs-on: macos-latest
    if: ${{ vars.RELEASE_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: import Developer ID cert
        if: ${{ secrets.CERTIFICATE_OSX_APPLICATION != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          p12-password: ${{ secrets.CERTIFICATE_OSX_APPLICATION_PASSWORD }}

      - name: list codesigning identities
        run: security find-identity -v -p codesigning

      - name: setup notarytool credentials
        if: ${{ secrets.AC_NOTARY_PASSWORD != '' }}
        run: |
          xcrun notarytool store-credentials agentcookie-notary \
            --apple-id mvanhorn@gmail.com \
            --team-id NM8VT393AR \
            --password "${{ secrets.AC_NOTARY_PASSWORD }}"

      - name: make release
        run: make release

      - name: build release tarball
        run: scripts/release-tarball.sh "${{ github.ref_name }}"

      - name: upload darwin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries
          path: dist/*.tar.gz

  # Publish release after both builds complete
  publish:
    runs-on: ubuntu-latest
    needs: [build-linux, build-darwin]
    if: ${{ vars.RELEASE_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist/

      - name: download darwin artifacts
        uses: actions/download-artifact@v4
        with:
          name: darwin-binaries
          path: dist/

      - name: list artifacts
        run: ls -la dist/

      # Generate checksums for all archives
      - name: generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      # Create the GitHub release with all assets
      - name: create release
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.tar.gz \
            dist/checksums.txt \
            --title "agentcookie ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
