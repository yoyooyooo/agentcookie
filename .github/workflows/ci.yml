name: ci

on:
  push:
    branches:
      - main
      - "fork/**"
  pull_request:
    branches:
      - main
      - "fork/**"

jobs:
  test-macos:
    name: vet + test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: go build
        run: go build ./...
      - name: install agent-browser integration dependency
        run: |
          npm install -g agent-browser@0.33.0
          agent-browser install
      - name: agent-browser session injection E2E
        run: AGENTCOOKIE_AGENT_BROWSER_E2E=1 go test ./internal/cli -run '^TestAgentBrowserSessionInjectE2E$' -count=1

  test-linux:
    name: vet + test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      # Linux tests run without -race to avoid CGO requirements for some
      # macOS-specific code paths that are stubbed but still compiled.
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./...
