name: ci

on:
  push:
    branches:
      - main
      - "fork/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - "fork/**"

jobs:
  test-macos:
    name: vet + test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: go build
        run: go build ./...
      - name: install agent-browser integration dependency
        run: |
          npm install -g agent-browser@0.33.0
          agent-browser install
      - name: agent-browser session injection E2E
        run: AGENTCOOKIE_AGENT_BROWSER_E2E=1 go test ./internal/cli -run '^TestAgentBrowserSessionInjectE2E$' -count=1

  release-tooling:
    name: release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: shell syntax
        run: |
          bash -n scripts/sign.sh
          bash -n scripts/notarize.sh
          bash -n scripts/prepare-darwin-release-binary.sh
          bash -n scripts/generate-release-manifest.sh
          bash -n scripts/test-release-manifest.sh
          bash -n scripts/install-beta.sh
      - name: release manifest contract
        run: scripts/test-release-manifest.sh
      - name: check Darwin GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.14.3"
          args: check --config .goreleaser.yaml
      - name: check Linux GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.14.3"
          args: check --config .goreleaser.linux.yaml

  test-linux:
    name: vet + test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      # Linux tests run without -race to avoid CGO requirements for some
      # macOS-specific code paths that are stubbed but still compiled.
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./...
