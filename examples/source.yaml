# Example source.yaml. Copy to ~/.config/agentcookie/source.yaml on the
# machine where you log in interactively (your laptop).

# Fan-out targets are independently paired. The map key is the name accepted by
# `agentcookie source --target <name>`; omitting --target pushes to every enabled
# target. MagicDNS hostnames are resolved through Tailscale at sync time, so the
# source follows a target after re-auth gives it a new 100.x address.
targets:
  grok-bot:
    url: http://grok-bot:9999/sync
    peer: grok-bot
  mini:
    url: http://mini:9999/sync
    peer: mini
    # Optional source-side least-privilege filter for this target. The sink
    # applies its own policy again after decrypting the envelope.
    policy: allowlist
    domains:
      - pattern: "tailscale.com"
      - pattern: "%.tailscale.com"
  # parked-agent:
  #   url: http://parked-agent:9999/sync
  #   peer: parked-agent
  #   disabled: true

# Optional source browser adapter. Omit for Google Chrome. Supported: chrome,
# brave, edge, arc, dia. Atlas is recognized but its cookies cannot be decrypted
# through the path-based adapter; `agentcookie doctor` reports that boundary.
browser:
  name: dia
  profile: Default

# An explicit path overrides the browser/profile-derived Cookies path.
# chrome:
#   db_path: ~/Library/Application Support/Dia/User Data/Default/Cookies

# Legacy single-target source.yaml files remain supported. Use `sink` + `peer`
# instead of `targets`, never both:
# sink:
#   url: http://my-mac-mini:9999/sync
# peer:
#   hostname: my-mac-mini

# Legacy security.shared_secret remains accepted only for the legacy single
# target. Fan-out targets require one pairing-derived key per peer.
