# Example sink.yaml for Linux sinks (Grok Bot, cloud VM, etc.)
# Copy to ~/.config/agentcookie/sink.yaml

# IMPORTANT: Also create blocklist.yaml for the cookie policy.
# On Linux, omitted policy = allowlist-empty (ship nothing).
# See examples/blocklist.yaml for the sync-all configuration.

listen:
  # Address the sink's /sync HTTP listener binds to. Use your current
  # Tailscale 100.x address. After Tailscale re-auth, if this IP becomes
  # stale (no longer on any local interface), the sink auto-rebinds to
  # the new 100.x address on startup.
  #
  # Find your current Tailscale IP: tailscale ip -4
  addr: 100.x.y.z:9999

peer:
  # Hostname of the source machine (your Mac). After pairing, this
  # matches the filename under ~/.config/agentcookie/keys/.
  #
  # Find your Mac's hostname: tailscale status
  hostname: your-mac.tailnet.ts.net

# Live CDP injection: attach to an ALREADY-RUNNING Chrome and inject
# cookies via Chrome DevTools Protocol. This is the featured Linux path.
#
# Start Chrome with: google-chrome --remote-debugging-port=9223
#
# Do NOT set cdp.enabled or cdp.managed - those launch a SECOND Chrome
# subprocess which conflicts with browserUse/Puppeteer/Playwright
# connecting to the existing Chrome.
live_cdp:
  enabled: true
  # Default endpoint. Change if Chrome runs on a different port.
  # Common alternatives: 9222, 9224, 9228, 9229
  endpoint: http://127.0.0.1:9223

# Skip Chrome SQLite write. On Linux there's no Keychain and no way
# to write Chrome's encrypted cookie database. All injection is via CDP.
skip_chrome_sqlite: true

# --- macOS ordinary Chrome delivery ---
#
# To deliver into the user's normal Google Chrome profile, choose one explicit
# mode. `offline` is unattended: it gracefully stops a running Chrome, writes
# host-bound Cookie rows, then restores the prior running state. `live` uses
# DevToolsActivePort instead and requires `agentcookie chrome enable` plus the
# Chrome approval dialog.
#
# real_chrome:
#   enabled: true
#   mode: offline
#   profile: Default
#   # auto_approve: true # live mode only
#   # user_data_dir: ~/Library/Application Support/Google/Chrome
#   # domain_filter:
#   #   - "example.com"
#   #   - "%.example.com"
#
# Keep skip_chrome_sqlite: true when real_chrome is the intended delivery
# surface. Offline mode owns its bounded, host-bound write and does not run the
# legacy sink SQLite path; live mode never edits SQLite.
#
# --- other macOS-only options (do not use on Linux) ---
#
# cdp:
#   # Launches a managed Chrome subprocess with its own profile.
#   # Use only on macOS when you want CDP injection into an
#   # agentcookie-owned Chrome, not your everyday browser.
#   enabled: true
#   managed: true
#   # profile_dir: ~/.agentcookie/chrome-profile
#
# chrome:
#   # Only set db_path for legacy SQLite mode on macOS.
#   # db_path: ~/Library/Application Support/Google/Chrome/Default/Cookies
