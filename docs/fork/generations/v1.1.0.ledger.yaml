    evidence:
      - .github/workflows/release.yml
      - .goreleaser.yaml
      - .goreleaser.linux.yaml
      - scripts/generate-release-manifest.sh
      - scripts/test-release-manifest.sh
      - docs/fork/RELEASING.md
    dependencies: [github-actions-node24]
    migration_impact: install exact fork tag and verify archive checksum plus release manifest
    replay_branch: release/fork-v1.1.0-r4
    verification:
