  - id: strict-cookies-only
    title: Exclude non-Cookie browser and secrets surfaces
    category: feature
    prior_commits: [84e51d5c581e22c9b78da3c6bc0934bced634e31]
    decision: rework
    reason: The old commit skipped Local Storage and IndexedDB but still read and shipped the secrets bus; the requested boundary is Cookie-only.
    evidence:
      - internal/cli/source.go
      - internal/cli/source_test.go
    dependencies: [dia-source-adapter]
    migration_impact: none
    replay_branch: fix/cookies-only-boundary-v1.1.0
    verification:
      - go test ./internal/cli -run TestCookiesOnlyDoesNotShipSecretsBus

  - id: source-fanout
    title: Push one prepared Cookie set to independently paired named sinks
    category: feature
    prior_commits: [6444ff78029e84ae4574f243fb65ba5f53757a43]
    decision: rework
    reason: Fan-out remains required, but every target must retain upstream v1.1.0 Tailscale hostname resolution and the old commit bundled unrelated sink behavior.
    evidence:
      - internal/config/fanout_test.go
      - internal/cli/source_test.go
      - official sink handler compatibility test
    dependencies: [strict-cookies-only]
    migration_impact: none
    replay_branch: feature/fanout-v1.1.0
    verification:
      - go test ./...
      - go test -race ./internal/config ./internal/cli
      - go vet ./...

  - id: live-cdp-only-sink
    title: Keep accepted Cookie state only in a running sink browser
    category: feature
    prior_commits: [6444ff78029e84ae4574f243fb65ba5f53757a43]
    decision: retire
    reason: Fixed Chrome should retain the official sink materialization paths, while temporary Agent Browser instances receive explicit per-session injection. The memory-only sink prevents later on-demand sessions from reading the official sidecar.
    evidence:
      - internal/cli/sink.go has no fork delta from v1.1.0
      - docs/agent-browser-sessions.md
    dependencies: []
    migration_impact: none
    verification:
      - git diff v1.1.0..fork/v1.1.0 -- internal/cli/sink.go
    retirement_condition: Retired in fork/v1.1.0; deployed live_cdp_only configs must migrate before installing this generation.

  - id: persistent-context-syncer
    title: Inject future BrowserContexts from a long-running sink process
    category: feature
    prior_commits: [6444ff78029e84ae4574f243fb65ba5f53757a43]
    decision: retire
    reason: Explicit session-scoped injection is deterministic, releases idle browser memory, and avoids granting every future context the same identity.
    evidence:
      - internal/cli/agent_browser.go
      - internal/cli/agent_browser_e2e_test.go
    dependencies: []
    migration_impact: none
    verification:
      - AGENTCOOKIE_AGENT_BROWSER_E2E=1 go test ./internal/cli -run '^TestAgentBrowserSessionInjectE2E$' -count=1

  - id: named-agent-browser-session-injection
    title: Inject the local authoritative Cookie set into one named Agent Browser session
    category: feature
    prior_commits: []
    decision: keep
    reason: Source and sink operators need on-demand identity in independent temporary Agent Browser sessions; the user-facing capability remains while its r1/r2 transport is superseded.
    evidence:
      - docs/agent-browser-sessions.md
      - internal/cli/agent_browser_test.go
      - internal/cli/agent_browser_e2e_test.go
      - pkg/sidecar/reader_test.go
    dependencies: [dia-source-adapter, source-fanout]
    migration_impact: none
    replay_branch: feature/agent-browser-session-inject-v1.1.0
    verification:
      - go test ./...
      - go test -race ./...
      - go vet ./...
      - AGENTCOOKIE_AGENT_BROWSER_E2E=1 go test ./internal/cli -run '^TestAgentBrowserSessionInjectE2E$' -count=10

  - id: patched-go-toolchain
    title: Build and test with the patched Go 1.26.6 standard library
    category: fix
    prior_commits: []
    decision: keep
    reason: Go 1.26.4 had six reachable standard-library vulnerabilities; 1.26.6 contains the official fixes.
    evidence:
      - go.mod
      - govulncheck reports zero reachable vulnerabilities
    dependencies: []
    migration_impact: none
    replay_branch: fix/go-1.26.6-v1.1.0
    verification:
      - go test -race ./...
      - go vet ./...
      - govulncheck ./...

  - id: non-owning-browser-websocket-injection
    title: Inject through browser-level CDP without taking ownership of Agent Browser pages
    category: fix
    prior_commits: []
    decision: superseded
    reason: r1 avoided page ownership through a second browser WebSocket, but r3 delegates Cookie writes to agent-browser's native session RPC and removes the second CDP client entirely.
    evidence:
      - commit 8956299
      - internal/livecdp/browser_websocket.go deleted by f29dba8
      - internal/cli/agent_browser_e2e_test.go
    dependencies: [named-agent-browser-session-injection, patched-go-toolchain]
    migration_impact: none
    replay_branch: fix/agent-browser-browser-level-cdp-v1.1.0
    verification:
      - AGENTCOOKIE_AGENT_BROWSER_E2E=1 go test ./internal/cli -run '^TestAgentBrowserSessionInjectE2E$' -count=10
      - go test -race ./...
    superseded_by: native-agent-browser-session-rpc
    retirement_condition: Superseded in fork-v1.1.0-r3; retained only in immutable r1/r2 history.

  - id: direct-websocket-readiness-retry
    title: Retry early same-URL CDP readiness for a newly started session
    category: fix
    prior_commits: []
    decision: superseded
    reason: r2 bounded a startup race in the direct-WebSocket transport; r3 removes that transport and lets agent-browser own daemon readiness.
    evidence:
      - commit 6d883c8
      - tag fork-v1.1.0-r2
    dependencies: [non-owning-browser-websocket-injection]
    migration_impact: none
    replay_branch: fix/agent-browser-cdp-readiness-v1.1.0
    verification:
      - GitHub ci run 33291642418
      - GitHub lint run 33291642394
      - GitHub govulncheck run 33291642353
    superseded_by: native-agent-browser-session-rpc
    retirement_condition: Superseded in fork-v1.1.0-r3; retained only in immutable r2 history.

  - id: native-agent-browser-session-rpc
    title: Inject through agent-browser native JSON batch stdin
    category: fix
    prior_commits: []
    decision: keep
    reason: Native session RPC preserves agent-browser ownership, needs no fixed CDP port or second WebSocket, and keeps Cookie values out of argv, logs, output, and temporary files.
    evidence:
      - internal/cli/agent_browser.go
      - internal/cli/agent_browser_test.go
      - internal/cli/agent_browser_e2e_test.go
      - docs/agent-browser-sessions.md
    dependencies: [named-agent-browser-session-injection, patched-go-toolchain]
    migration_impact: none
    replay_branch: fix/agent-browser-native-session-rpc-v1.1.0
    verification:
      - go test -race ./...
      - AGENTCOOKIE_AGENT_BROWSER_E2E=1 go test ./internal/cli -run '^TestAgentBrowserSessionInjectE2E$' -count=10
      - two parallel cold named-session injections
      - GitHub ci run 33292425731
      - GitHub lint run 33292425590
      - GitHub govulncheck run 33292425642

  - id: explicit-official-sink-test-policy
    title: Make the official sink compatibility fixture platform-independent
    category: test
    prior_commits: []
    decision: keep
    reason: Linux intentionally defaults a missing policy to an empty allowlist, while Darwin defaults to blocklist/sync-all. A wire compatibility test must state trusted sync-all explicitly.
    evidence:
      - internal/cli/source_test.go
    dependencies: [source-fanout]
    migration_impact: none
    replay_branch: fix/linux-sink-compat-test-v1.1.0
    verification:
      - Linux amd64 go test ./...

  - id: root-execute-test-portability
    title: Test unix.Access using the current process credential semantics
    category: test
    prior_commits: []
    decision: rework
    reason: POSIX root may execute a regular file when any execute bit is set. The upstream test incorrectly assumed every runner is a non-root file owner; production unix.Access behavior remains unchanged.
    evidence:
      - internal/sinkpush/find_cli_test.go
      - internal/sinkpush/find_cli_permissions_unix_test.go
      - internal/sinkpush/find_cli_permissions_other_test.go
    dependencies: []
    migration_impact: none
    replay_branch: fix/root-exec-permission-test-v1.1.0
    verification:
      - Linux amd64 go test ./...
      - GitHub ci run 33290928830
    retirement_condition: Retire when an official release contains equivalent root/non-root test semantics.

  - id: github-actions-node24
    title: Run fork CI and future release transfers on maintained Node 24 action runtimes
    category: operations
    prior_commits: []
    decision: keep
    reason: GitHub deprecated Node 20 action runtimes. Checkout, setup-go, and GoReleaser were already on Node 24 for r4; the successful r4 release exposed forced-Node-24 warnings from artifact v4, so the post-r4 generation branch pins upload-artifact v7.0.1 and download-artifact v8.0.1 for the next release.
    evidence:
