    title: Exclude non-Cookie browser and secrets surfaces
    category: feature
    prior_commits: [84e51d5c581e22c9b78da3c6bc0934bced634e31]
    decision: rework
    reason: The old commit skipped Local Storage and IndexedDB but still read and shipped the secrets bus; the requested boundary is Cookie-only.
