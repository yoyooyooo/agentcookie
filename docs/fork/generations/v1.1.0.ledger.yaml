      - go vet ./...
      - govulncheck ./...

  - id: non-owning-browser-websocket-injection
    title: Inject through browser-level CDP without taking ownership of Agent Browser pages
    category: fix
    prior_commits: []
    decision: superseded
    reason: r1 avoided page ownership through a second browser WebSocket, but r3 delegates Cookie writes to agent-browser's native session RPC and removes the second CDP client entirely.
    evidence:
      - commit 8956299
      - internal/livecdp/browser_websocket.go deleted by f29dba8
      - internal/cli/agent_browser_e2e_test.go
    dependencies: [named-agent-browser-session-injection, patched-go-toolchain]
    migration_impact: none
    replay_branch: fix/agent-browser-browser-level-cdp-v1.1.0
    verification:
      - AGENTCOOKIE_AGENT_BROWSER_E2E=1 go test ./internal/cli -run '^TestAgentBrowserSessionInjectE2E$' -count=10
      - go test -race ./...
    superseded_by: native-agent-browser-session-rpc
    retirement_condition: Superseded in fork-v1.1.0-r3; retained only in immutable r1/r2 history.

  - id: direct-websocket-readiness-retry
    title: Retry early same-URL CDP readiness for a newly started session
    category: fix
    prior_commits: []
    decision: superseded
    reason: r2 bounded a startup race in the direct-WebSocket transport; r3 removes that transport and lets agent-browser own daemon readiness.
    evidence:
      - commit 6d883c8
      - tag fork-v1.1.0-r2
    dependencies: [non-owning-browser-websocket-injection]
    migration_impact: none
    replay_branch: fix/agent-browser-cdp-readiness-v1.1.0
    verification:
      - GitHub ci run 33291642418
      - GitHub lint run 33291642394
      - GitHub govulncheck run 33291642353
    superseded_by: native-agent-browser-session-rpc
    retirement_condition: Superseded in fork-v1.1.0-r3; retained only in immutable r2 history.

  - id: native-agent-browser-session-rpc
    title: Inject through agent-browser native JSON batch stdin
    category: fix
    prior_commits: []
    decision: keep
    reason: Native session RPC preserves agent-browser ownership, needs no fixed CDP port or second WebSocket, and keeps Cookie values out of argv, logs, output, and temporary files.
    evidence:
      - internal/cli/agent_browser.go
      - internal/cli/agent_browser_test.go
      - internal/cli/agent_browser_e2e_test.go
      - docs/agent-browser-sessions.md
