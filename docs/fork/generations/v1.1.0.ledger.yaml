deployment_validation:
  evidence_scope: public-role-level
  operator_receipts: intentionally-not-published
  roles:
    - role: source-workstation
      architecture: darwin-arm64
      validated:
        - fork-v1.1.0-r4 version and release-artifact readback
        - Dia source read
        - strict Cookie-only boundary
        - independently paired fan-out with per-target policy
    - role: restricted-sink
      architecture: darwin-arm64
      validated:
        - fork-v1.1.0-r4 version and release-artifact readback
        - official-compatible sidecar and live-CDP materialization
        - allowlisted named-session injection
        - authenticated navigation and session close
    - role: headless-sink
      architecture: linux-amd64
      validated:
        - fork-v1.1.0-r4 version and release-artifact readback
        - official v1 wire compatibility and sidecar/live-CDP delivery
        - fork CLI named-session injection
        - authenticated navigation and session close
  privacy_boundary:
    - hostnames, OS usernames, local paths, schedules, process IDs, and per-machine artifact digests are operator-private
    - Cookie values and pairing material are excluded from all evidence
