  - id: live-cdp-only-sink
    title: Keep accepted Cookie state only in a running sink browser
    category: feature
    prior_commits: [6444ff78029e84ae4574f243fb65ba5f53757a43]
    decision: retire
    reason: Fixed Chrome should retain the official sink materialization paths, while temporary Agent Browser instances receive explicit per-session injection. The memory-only sink prevents later on-demand sessions from reading the official sidecar.
    evidence:
      - internal/cli/sink.go has no fork delta from v1.1.0
      - docs/agent-browser-sessions.md
    dependencies: []
    migration_impact: none
    verification:
      - git diff v1.1.0..fork/v1.1.0 -- internal/cli/sink.go
    retirement_condition: Retired in fork/v1.1.0; deployed live_cdp_only configs must migrate before installing this generation.

  - id: persistent-context-syncer
    title: Inject future BrowserContexts from a long-running sink process
    category: feature
    prior_commits: [6444ff78029e84ae4574f243fb65ba5f53757a43]
    decision: retire
    reason: Explicit session-scoped injection is deterministic, releases idle browser memory, and avoids granting every future context the same identity.
    evidence:
