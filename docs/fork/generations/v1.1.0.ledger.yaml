deltas:
  - id: dia-source-adapter
    title: Read the authoritative Dia Chromium profile on macOS
    category: feature
    prior_commits: [d462f4c6df951147b5d225a4acce5c97c3bfcc13]
    decision: keep
    reason: Upstream v1.1.0 still has no Dia browser descriptor or Keychain mapping.
    evidence:
      - internal/chrome/browser.go
      - internal/chrome/browser_test.go
    dependencies: []
    migration_impact: none
    replay_branch: feature/dia-v1.1.0
    verification:
      - go test ./internal/chrome ./internal/config ./internal/cli

  - id: strict-cookies-only
    title: Exclude non-Cookie browser and secrets surfaces
    category: feature
    prior_commits: [84e51d5c581e22c9b78da3c6bc0934bced634e31]
    decision: rework
    reason: The old commit skipped Local Storage and IndexedDB but still read and shipped the secrets bus; the requested boundary is Cookie-only.
    evidence:
      - internal/cli/source.go
      - internal/cli/source_test.go
    dependencies: [dia-source-adapter]
    migration_impact: none
    replay_branch: fix/cookies-only-boundary-v1.1.0
    verification:
      - go test ./internal/cli -run TestCookiesOnlyDoesNotShipSecretsBus

  - id: source-fanout
    title: Push one prepared Cookie set to independently paired named sinks
    category: feature
    prior_commits: [6444ff78029e84ae4574f243fb65ba5f53757a43]
    decision: rework
    reason: Fan-out remains required, but every target must retain upstream v1.1.0 Tailscale hostname resolution and the old commit bundled unrelated sink behavior.
    evidence:
      - internal/config/fanout_test.go
      - internal/cli/source_test.go
      - official sink handler compatibility test
    dependencies: [strict-cookies-only]
    migration_impact: none
    replay_branch: feature/fanout-v1.1.0
    verification:
      - go test ./...
      - go test -race ./internal/config ./internal/cli
      - go vet ./...

  - id: live-cdp-only-sink
    title: Keep accepted Cookie state only in a running sink browser
    category: feature
    prior_commits: [6444ff78029e84ae4574f243fb65ba5f53757a43]
    decision: retire
    reason: Fixed Chrome should retain the official sink materialization paths, while temporary Agent Browser instances receive explicit per-session injection. The memory-only sink prevents later on-demand sessions from reading the official sidecar.
    evidence:
      - internal/cli/sink.go has no fork delta from v1.1.0
      - docs/agent-browser-sessions.md
    dependencies: []
    migration_impact: none
    verification:
      - git diff v1.1.0..fork/v1.1.0 -- internal/cli/sink.go
    retirement_condition: Retired in fork/v1.1.0; deployed live_cdp_only configs must migrate before installing this generation.

  - id: persistent-context-syncer
    title: Inject future BrowserContexts from a long-running sink process
    category: feature
    prior_commits: [6444ff78029e84ae4574f243fb65ba5f53757a43]
    decision: retire
    reason: Explicit session-scoped injection is deterministic, releases idle browser memory, and avoids granting every future context the same identity.
    evidence:
      - internal/cli/agent_browser.go
      - internal/cli/agent_browser_e2e_test.go
    dependencies: []
    migration_impact: none
    verification:
      - AGENTCOOKIE_AGENT_BROWSER_E2E=1 go test ./internal/cli -run '^TestAgentBrowserSessionInjectE2E$' -count=1

  - id: named-agent-browser-session-injection
    title: Inject the local authoritative Cookie set into one named Agent Browser session
    category: feature
    prior_commits: []
    decision: keep
    reason: Source and sink operators need on-demand identity in independent temporary Agent Browser sessions; the user-facing capability remains while its r1/r2 transport is superseded.
    evidence:
      - docs/agent-browser-sessions.md
      - internal/cli/agent_browser_test.go
      - internal/cli/agent_browser_e2e_test.go
      - pkg/sidecar/reader_test.go
    dependencies: [dia-source-adapter, source-fanout]
    migration_impact: none
    replay_branch: feature/agent-browser-session-inject-v1.1.0
    verification:
      - go test ./...
      - go test -race ./...
      - go vet ./...
      - AGENTCOOKIE_AGENT_BROWSER_E2E=1 go test ./internal/cli -run '^TestAgentBrowserSessionInjectE2E$' -count=10

  - id: patched-go-toolchain
    title: Build and test with the patched Go 1.26.6 standard library
    category: fix
    prior_commits: []
    decision: keep
    reason: Go 1.26.4 had six reachable standard-library vulnerabilities; 1.26.6 contains the official fixes.
    evidence:
      - go.mod
      - govulncheck reports zero reachable vulnerabilities
    dependencies: []
    migration_impact: none
    replay_branch: fix/go-1.26.6-v1.1.0
    verification:
      - go test -race ./...
      - go vet ./...
      - govulncheck ./...

  - id: non-owning-browser-websocket-injection
    title: Inject through browser-level CDP without taking ownership of Agent Browser pages
    category: fix
    prior_commits: []
    decision: superseded
    reason: r1 avoided page ownership through a second browser WebSocket, but r3 delegates Cookie writes to agent-browser's native session RPC and removes the second CDP client entirely.
    evidence:
      - commit 8956299
      - internal/livecdp/browser_websocket.go deleted by f29dba8
      - internal/cli/agent_browser_e2e_test.go
    dependencies: [named-agent-browser-session-injection, patched-go-toolchain]
    migration_impact: none
    replay_branch: fix/agent-browser-browser-level-cdp-v1.1.0
    verification:
      - AGENTCOOKIE_AGENT_BROWSER_E2E=1 go test ./internal/cli -run '^TestAgentBrowserSessionInjectE2E$' -count=10
      - go test -race ./...
    superseded_by: native-agent-browser-session-rpc
    retirement_condition: Superseded in fork-v1.1.0-r3; retained only in immutable r1/r2 history.

  - id: direct-websocket-readiness-retry
    title: Retry early same-URL CDP readiness for a newly started session
    category: fix
    prior_commits: []
    decision: superseded
    reason: r2 bounded a startup race in the direct-WebSocket transport; r3 removes that transport and lets agent-browser own daemon readiness.
    evidence:
      - commit 6d883c8
      - tag fork-v1.1.0-r2
    dependencies: [non-owning-browser-websocket-injection]
    migration_impact: none
    replay_branch: fix/agent-browser-cdp-readiness-v1.1.0
    verification:
      - GitHub ci run 33291642418
      - GitHub lint run 33291642394
      - GitHub govulncheck run 33291642353
    superseded_by: native-agent-browser-session-rpc
    retirement_condition: Superseded in fork-v1.1.0-r3; retained only in immutable r2 history.

  - id: native-agent-browser-session-rpc
    title: Inject through agent-browser native JSON batch stdin
    category: fix
    prior_commits: []
    decision: keep
    reason: Native session RPC preserves agent-browser ownership, needs no fixed CDP port or second WebSocket, and keeps Cookie values out of argv, logs, output, and temporary files.
    evidence:
      - internal/cli/agent_browser.go
      - internal/cli/agent_browser_test.go
      - internal/cli/agent_browser_e2e_test.go
      - docs/agent-browser-sessions.md
    dependencies: [named-agent-browser-session-injection, patched-go-toolchain]
    migration_impact: none
    replay_branch: fix/agent-browser-native-session-rpc-v1.1.0
    verification:
      - go test -race ./...
      - AGENTCOOKIE_AGENT_BROWSER_E2E=1 go test ./internal/cli -run '^TestAgentBrowserSessionInjectE2E$' -count=10
      - two parallel cold named-session injections
      - GitHub ci run 33292425731
      - GitHub lint run 33292425590
      - GitHub govulncheck run 33292425642

  - id: explicit-official-sink-test-policy
    title: Make the official sink compatibility fixture platform-independent
    category: test
    prior_commits: []
    decision: keep
    reason: Linux intentionally defaults a missing policy to an empty allowlist, while Darwin defaults to blocklist/sync-all. A wire compatibility test must state trusted sync-all explicitly.
    evidence:
      - internal/cli/source_test.go
    dependencies: [source-fanout]
    migration_impact: none
    replay_branch: fix/linux-sink-compat-test-v1.1.0
    verification:
      - Linux amd64 go test ./...

  - id: root-execute-test-portability
    title: Test unix.Access using the current process credential semantics
    category: test
    prior_commits: []
    decision: rework
    reason: POSIX root may execute a regular file when any execute bit is set. The upstream test incorrectly assumed every runner is a non-root file owner; production unix.Access behavior remains unchanged.
    evidence:
      - internal/sinkpush/find_cli_test.go
      - internal/sinkpush/find_cli_permissions_unix_test.go
      - internal/sinkpush/find_cli_permissions_other_test.go
    dependencies: []
    migration_impact: none
    replay_branch: fix/root-exec-permission-test-v1.1.0
    verification:
      - Linux amd64 go test ./...
      - GitHub ci run 33290928830
    retirement_condition: Retire when an official release contains equivalent root/non-root test semantics.

  - id: github-actions-node24
    title: Run fork CI and future release transfers on maintained Node 24 action runtimes
    category: operations
    prior_commits: []
    decision: keep
    reason: GitHub deprecated Node 20 action runtimes. Checkout, setup-go, and GoReleaser were already on Node 24 for r4; the successful r4 release exposed forced-Node-24 warnings from artifact v4, so the post-r4 generation branch pins upload-artifact v7.0.1 and download-artifact v8.0.1 for the next release.
    evidence:
      - .github/workflows/ci.yml
      - .github/workflows/lint.yml
      - .github/workflows/govulncheck.yml
      - .github/workflows/release.yml
    dependencies: []
    migration_impact: none
    replay_branch: chore/actions-node24-v1.1.0
    verification:
      - actionlint
      - GitHub ci run 33301548966
      - GitHub lint run 33301549077
      - GitHub govulncheck run 33301548933
      - GitHub release run 33301650124 succeeded; artifact v4 warnings were non-fatal
      - pinned upload-artifact v7.0.1 and download-artifact v8.0.1 action.yml read back node24

  - id: reproducible-fork-release-artifacts
    title: Publish immutable multi-platform fork archives with checksums and a machine-readable manifest
    category: operations
    prior_commits: []
    decision: keep
    reason: Source acceptance alone did not give other machines one verifiable install authority. r4 binds an annotated fork tag to four platform archives, checksums, explicit Darwin signing mode, and the peeled source SHA.
    accepted_commits:
      - fb470b21cc0492ea722043dbe7606be7835633fc
      - 981f7c85441ef1eec839dfac5f8eeb7bf53ba071
      - b4c6f1933c93cf5bce720324ad6bb05410ddb287
      - 4e9f3f0e9807f5fa367e4f3b61f66c4ac57a8315
      - 7449d9242a05ac2fbcf45cab1635cf9ba9d53c8d
      - 5724ee6d90bdfd97fa17369d8cfeb4e7e1f3fbba
    evidence:
      - .github/workflows/release.yml
      - .goreleaser.yaml
      - .goreleaser.linux.yaml
      - scripts/generate-release-manifest.sh
      - scripts/test-release-manifest.sh
      - docs/fork/RELEASING.md
    dependencies: [github-actions-node24]
    migration_impact: install exact fork tag and verify archive checksum plus release manifest
    replay_branch: release/fork-v1.1.0-r4
    verification:
      - scripts/test-release-manifest.sh
      - clean release-mode Darwin amd64 and arm64 builds
      - clean release-mode Linux amd64 and arm64 builds
      - GitHub release run 33301650124
      - public Release asset download and sha256sum verification

  - id: ordinary-google-chrome-delivery
    title: Deliver source or sink identity into the user's normal Google Chrome Default profile
    category: feature
    prior_commits: []
    decision: keep
    reason: The current generation delivered to remote automation Chrome and isolated Agent Browser sessions but had no explicit consumer for the ordinary Chrome profile used by desktop browser-control tools.
    accepted_commits:
      - 2ea8a70ce60c7dca27d931cc7148e2578b33c3a0
    evidence:
      - internal/realchrome/realchrome.go
      - internal/cli/chrome.go
      - internal/cli/source_test.go
      - internal/cli/sink_test.go
      - docs/ordinary-chrome.md
    dependencies: [dia-source-adapter, source-fanout]
    migration_impact: run agentcookie chrome enable once; configure real_chrome on each intended source or macOS sink; remove automation-browser live_cdp when it was an accidental target
    replay_branch: feature/real-chrome-sync-v1.1.0
    verification:
      - go test ./...
      - go test -race ./...
      - go vet ./...
      - Mini ordinary Google Chrome 149 reached the authenticated Tailscale DNS console after live injection; Fortress and temporary Agent Browser processes were excluded

  - id: unattended-ordinary-google-chrome-delivery
    title: Deliver into ordinary Chrome without a visible DevTools approval dialog
    category: fix
    prior_commits: []
    decision: rework
    reason: r5 live mode is correct for visible desktops, but Chrome 149 requires an interactive approval dialog on every new connection and rejects legacy plain-v10 cold writes. Unattended macOS needs a Chrome-specific host-bound offline write.
    accepted_commits:
      - 7d09916ee8719f5bc9b17cf3cc22047528991331
      - c53fedea2660b6ad71413027a1a1ab7d167466a7
    evidence:
      - internal/chrome/write_appbound.go
      - internal/chrome/write_appbound_test.go
      - internal/realchrome/realchrome.go
      - internal/realchrome/realchrome_test.go
      - docs/ordinary-chrome.md
    dependencies: [ordinary-google-chrome-delivery]
    migration_impact: set real_chrome.mode to offline on unattended macOS; Chrome briefly restarts only when it was already running; run agentcookie chrome disable after retiring live mode
    replay_branch: fix/ordinary-chrome-offline-v1.1.0
    verification:
      - go test ./...
      - go test -race ./...
      - go vet ./...
      - Linux amd64 full suite after platform-gating the macOS runtime fixture
      - real Chrome 149 Default Profile retained Facebook c_user/xs and Xiaohongshu web_session across a cold load
      - OpenCLI Facebook whoami and a login-required Xiaohongshu collection succeeded after offline delivery

  - id: stable-darwin-codesign-identifier
    title: Keep one macOS firewall and privacy identity across ad-hoc release revisions
    category: operations
    prior_commits: []
    decision: rework
    reason: content-hash-only ad-hoc designated requirements make every release look like a different inbound-listening application. A stable identifier and designated requirement preserve identity after the first approval.
    accepted_commits:
      - 7d09916ee8719f5bc9b17cf3cc22047528991331
    evidence:
      - scripts/sign.sh
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - docs/fork/RELEASING.md
    dependencies: [reproducible-fork-release-artifacts]
    migration_impact: first direct-listener install under the stable identifier may require one firewall approval; later revisions retain it
    replay_branch: fix/ordinary-chrome-offline-v1.1.0
    verification:
      - codesign --verify --strict
      - codesign designated requirement equals identifier io.github.yoyooyooo.agentcookie
      - hosted macOS signing gate on the final candidate

